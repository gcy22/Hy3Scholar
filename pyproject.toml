[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hy3scholar"
version = "0.2.0"
description = "Evidence-grounded literature review and Dataset v0 evaluation with Tencent Hy3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "fonttools>=4.50,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
demo = ["imageio-ffmpeg>=0.6,<1", "pillow>=10,<13"]

[project.scripts]
hy3scholar = "hy3scholar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hy3scholar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
